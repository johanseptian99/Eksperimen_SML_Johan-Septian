name: Dataset Preprocessing Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "dataset_raw/**"
      - "preprocessing/automate_Johan-Septian.py"
      - "environment.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  preprocessing:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: sml-preprocessing
          environment-file: environment.yml
          auto-activate-base: false
          python-version: 3.12.7

      - name: Verify Environment
        shell: bash -l {0}
        run: |
          python --version
          conda info
          conda list

      - name: Run Preprocessing
        shell: bash -l {0}
        run: |
          cd preprocessing
          python automate_Johan-Septian.py

      - name: Upload Dataset Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dataset_preprocessing
          path: preprocessing/dataset_preprocessing/

      - name: Commit Latest Dataset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash -l {0}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add preprocessing/dataset_preprocessing/*

          git diff --cached --quiet || \
          git commit -m "Auto update preprocessing dataset"

          git push